# The afterbrew deployment of Octopus. Not upstream's `docker-compose.selfhost.yml`.
#
# A separate file rather than an edit, so upstream's compose keeps merging cleanly
# and every divergence below is visible as a divergence rather than as a conflict.
#
#   docker compose -f deploy/afterbrew/docker-compose.yml up -d
#
# rayf P-0007 C1b and C4 are what shape this. Four things differ from upstream and
# each is load-bearing:
#
# 1. Images are pinned by DIGEST, not tag. Upstream defaults the web image to
#    `:latest`, which means a `docker compose pull` can change what is running with
#    no change here to review. A digest cannot move.
#
# 2. PostgreSQL and Qdrant publish NO host ports. Upstream maps 43332, 43333 and
#    43334, which puts a database and a vector store on the host's interfaces.
#    C4 requires them private to the compose network; services reach each other by
#    service name over that network without any published port at all.
#
# 3. The dashboard binds 127.0.0.1 only. Reachable over an SSH tunnel, not from the
#    LAN. ADR-0056 keeps the dashboard private and admits only the signature-verified
#    webhook route publicly. That admission is the `ingress` service: a route
#    allowlist in front of `web`, so what a tunnel can reach is one POST path rather
#    than all ~110 API routes and the dashboard.
#
# 4. No credential has a default. Upstream ships `octopus:octopus`; `${VAR:?}` here
#    means compose REFUSES to start when a variable is unset rather than silently
#    using a known password. Generate them with ./generate-secrets.sh.
services:
  web:
    image: ghcr.io/octopusreview/octopus-selfhost@sha256:38b160c4f996ecdc6067ec80caf2b4cf8371fb086fd38ab1bfe1baf453000ce7
    ports:
      # Loopback only. Changing this to `${PORT}:3000` publishes the dashboard to
      # every interface on the host, which is the thing C4 exists to prevent.
      - "127.0.0.1:${OCTOPUS_PORT:-43300}:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      - QDRANT_URL=http://qdrant:6333
      - ENABLE_REVIEW_WORKERS=true
      # Better Auth's `trustedOrigins` is exactly `[BETTER_AUTH_URL]`. Unset, that
      # array holds `undefined`, every sign-in request is rejected as "Invalid
      # origin", and nothing says why. Derived from the published port here so the
      # two cannot drift; override it when reaching the dashboard by another name.
      #
      # Its NEXT_PUBLIC_ sibling is deliberately absent: those are inlined into the
      # client bundle at image build time, so setting one at runtime would look
      # like configuration and do nothing.
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:${OCTOPUS_PORT:-43300}}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # Reboot survival without root: the docker daemon is enabled at boot on the
    # target host, so a restart policy brings these back with no systemd unit and
    # no privileged install. See rayf P-0007 C6.
    restart: unless-stopped

  # The only service a tunnel is ever pointed at. See ./Caddyfile for what it
  # admits and why it is an allowlist.
  #
  # Published on loopback for the same reason as `web`: the tunnel client runs on
  # the host as an unprivileged process and dials this locally. Nothing on the LAN
  # can reach it, so the exposure is exactly the tunnel and nothing else.
  ingress:
    # caddy 2.11.4. Pinned by digest for the same reason as every other image here.
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports:
      - "127.0.0.1:${OCTOPUS_INGRESS_PORT:-43310}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
    healthcheck:
      # Against :8081, which has no host publication and is not what the tunnel is
      # pointed at. Probing :8080 instead would mean either adding a 200 route to
      # the allowlist -- reachable from the internet, for a container's benefit --
      # or asserting on a 404, which wget reports as a failure.
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    # No `ports:`. Deliberate, and the single most important line in this file.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    # No `ports:` either. Qdrant has no authentication in this configuration, so a
    # published port is an unauthenticated vector store on the network.
    volumes:
      - qdrant_data:/qdrant/storage
    # Upstream's healthcheck shells out to `wget`. The qdrant image contains
    # neither wget nor curl, so that check can never pass and `web`, which waits
    # on `service_healthy`, never starts -- upstream's own selfhost compose does
    # not come up. Reported as an issue on the fork.
    #
    # `bash` and `/dev/tcp` are present, so this speaks HTTP directly and asserts
    # a 200 from /readyz. A bare TCP connect would prove the port is open while
    # qdrant was still loading collections, which is the state the dependency
    # ordering exists to wait out.
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q '200 OK'",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
